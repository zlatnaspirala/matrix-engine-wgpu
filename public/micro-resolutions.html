<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.web" />
  <title>Matrix Engine Powered by webGPU (The Beast). Created by Nikola Lukic zlatnaspirala@gmail.com </title>
  <meta name="description" content="Draw loop per pipeline not per mesh (PipelineManager) with share material. Power optimisation.
✔️ Support for 3D objects and scene transformations.
✔️ Ammo.js, cannonES && Jolt Physics libs integration (app-bridge-worker). Physics use webworkers by default.
✔️ Networking with Kurento/OpenVidu/Own middleware Nodejs - frontend.
✔️ Bloom post processing.
✔️ HZB post processing.
✔️ Scene Culling feature" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link defer rel="stylesheet" href="css/mobile.css" />
  <link rel="apple-touch-icon" href="res/icons/512.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="256x256" href="res/icons/512.webp" />
  <script src="./hacker-timer/hack-timer-worker.min.js"></script>
</head>
<body allow="autoplay">
  <div class="header" style="display: contents;text-align: center;font-size: large;">
    The Beast <span>+Android Chrome</span> <a style="color:black;font-size: small;" href="https://github.com/zlatnaspirala/matrix-engine-wgpu">Source and Credits github project</a>
  </div>
  <iframe class="btn" src="https://maximumroulette.com/apps/webgpu/fullscreen.html?demo=30" id="banner1"></iframe>
  <div id="examples" style="top: 100px;left: 0;display: none; flex-direction: column;width: 400px;position: absolute;height: 80vh; overflow-y: scroll;overflow-x: hidden;">
  </div>

  <div id="matrix-net"></div>
  <div id="log" class="msg-box animate1">mewgpu</div>
  <div id="msgBox" class="msg-box animate1" onclick="mb.copy()"></div>
  
  <script>
    document.addEventListener('touchstart', function(e) {
      if(e.touches.length > 1) e.preventDefault()
    }, {passive: false});

    document.addEventListener('touchmove', function(e) {
      if(e.touches.length > 1) e.preventDefault()
    }, {passive: false});

    document.addEventListener('gesturestart', function(e) {
      e.preventDefault()
    });

    let lastTouchEnd = 0;

    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if(now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, {passive: false});

    document.getElementById('sliderMenu1').addEventListener('click', () => {
      if(document.getElementById('examples').style.left == "0px") {
        document.getElementById('examples').style.left = "-150px";
      } else {
        document.getElementById('examples').style.left = "0px";
      }
    }, {passive: true});
  </script>
</body>
</html>
