<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="manifest.web" />
  <title>Matrix Engine Powered by webGPU (The Beast). Created by Nikola Lukic zlatnaspirala@gmail.com </title>
  <meta name="description" content="Draw loop per pipeline not per mesh (PipelineManager) with share material. Power optimisation.
✔️ Support for 3D objects and scene transformations.
✔️ Ammo.js, cannonES && Jolt Physics libs integration (app-bridge-worker). Physics use webworkers by default.
✔️ Networking with Kurento/OpenVidu/Own middleware Nodejs - frontend.
✔️ Bloom post processing.
✔️ HZB post processing.
✔️ Scene Culling feature" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link defer rel="stylesheet" href="css/mobile.css" />
  <link rel="apple-touch-icon" href="res/icons/512.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="256x256" href="res/icons/512.webp" />
  <script src="./hacker-timer/hack-timer-worker.min.js"></script>
</head>

<body allow="autoplay">
  <div class="header" style="display: contents;text-align: center;font-size: large;">
    The Beast <span>+Android Chrome</span> <a style="color:black;font-size: small;" href="https://github.com/zlatnaspirala/matrix-engine-wgpu">Source and Credits github project</a>
  </div>
  <button class="btn" style="top: 42px;left: 0;position:absolute;font-size: 13px;width: 150px;" id="sliderMenu1">Menu 👉🏼</button>
  <div id="examples" style="top: 100px;left: 0;display: flex; flex-direction: column;width: 180px;position: absolute;height: 80%;overflow-y: scroll;overflow-x: hidden;">
    <button class="btn" id="loadObjFile">Load meshes</button>
    <button class="btn" id="physicsPlayground">Physics AMMO</button>
    <button class="btn" id="test-jolt">Physics JOLT</button>
    <button class="btn" id="test-cannones">Physics CannonES</button>
    <button class="btn" id="objs-anim">Objs Sequence</button>
    <button class="btn" id="video-texture">Video texture</button>
    <button class="btn" id="camera-texture">Camera texture</button>
    <button class="btn" id="glb-loader">GLB loader</button>
    <button class="btn" id="loadBVHSkeletal">BVH loader (ray)</button>
    <button class="btn" id="loadBVHSkeletalShared">BVH loader shared mat</button>
    <button class="btn" id="loadWaterEffects">Water effect</button>
    <button class="btn" id="loadParticles">Particless effect</button>
    <button class="btn" id="procedural-mesh">Procedural-mesh-morph</button>
    <button class="btn" id="myLights">My Lights</button>
    <button class="btn" id="snake-light">Snake Lights</button>
    <button class="btn" id="snake-light-instanced">Snake Lights - Instanced</button>
    <button class="btn" id="flipper-jolt">Flipper (Jolt)</button>
    <button class="btn" id="flipper-ammo">Flipper (Ammo)</button>
    <button class="btn" id="maze">Maze game</button>
    <button class="btn" id="canvas-inline">Canvas inline</button>
    <button class="btn" id="cinematicCamera">Cinematic camera</button>
    <button class="btn" id="destruction-procedure">Destruction ProceduralMesh</button>
    <button class="btn" id="loadkale">Kale effect</button>
    <button class="btn" id="loadhzb">HZB Ray</button>
    <button class="btn" id="loadKCollision">Kinematic Collision</button>
    <button class="btn" id="loadSprite1">Sprite2d BatchManager</button>
    <button class="btn" id="loadSprite2">2D Matter physics</button>
    <button class="btn" id="loadDrumCannon">3d Drum balls</button>
    <button class="btn" id="loadGaussianSplat">Gaussian splat color animator</button>
    <button class="btn" id="loadGaussianSplatVertAnim">Gaussian splat vertex animation</button>
    <button class="btn" id="hand">Hand commander</button>
    <button class="btn" id="loadRunner">NUI Runner</button>
    <button class="btn" id="loadMenuBeast">My NUI</button>
    <button class="btn" id="loadStreamRenderHost">Port render to android TV</button>
    <button class="btn" id="hang3d">First prson shooter hang3d-the-beast</button>
    <button class="btn" id="jamb">Jamb game</button>
    <button class="btn" id="moba">MOBA game</button>
  </div>
  <div id="matrix-net"></div>
  <div id="log" class="msg-box animate1">mewgpu</div>
  <div id="msgBox" class="msg-box animate1" onclick="mb.copy()"></div>
  <script src="examples.js"></script>
  <script>
    document.addEventListener('touchstart', function(e) {
      if(e.touches.length > 1) e.preventDefault()
    }, {passive: false});

    document.addEventListener('touchmove', function(e) {
      if(e.touches.length > 1) e.preventDefault()
    }, {passive: false});

    document.addEventListener('gesturestart', function(e) {
      e.preventDefault()
    });

    let lastTouchEnd = 0;

    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if(now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, {passive: false});

    document.getElementById('sliderMenu1').addEventListener('click', () => {
      if(document.getElementById('examples').style.left == "0px") {
        document.getElementById('examples').style.left = "-150px";
      } else {
        document.getElementById('examples').style.left = "0px";
      }
    }, {passive: true});
  </script>
</body>
</html>
